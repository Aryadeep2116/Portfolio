<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alex Morgan — Frontend Developer · React · JavaScript · AI Integrations</title>
    <meta
      name="description"
      content="Freelance frontend developer building fast, polished React websites, landing pages and AI-powered web features for startups and businesses. Remote, worldwide."
    />
    <meta name="author" content="Alex Morgan" />
    <meta
      name="keywords"
      content="frontend developer, React developer, web developer, freelance frontend developer, modern websites, landing pages, React development, AI web integrations, hire React developer"
    />
    <link rel="canonical" href="https://alexmorgan.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a1211" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f6f4" media="(prefers-color-scheme: light)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alex Morgan — Frontend Developer" />
    <meta property="og:title" content="Alex Morgan — Frontend Developer · React · JavaScript · AI" />
    <meta
      property="og:description"
      content="I build fast, polished React websites, landing pages and AI-powered web features for startups and businesses. View my work and start a project."
    />
    <meta property="og:url" content="https://alexmorgan.dev/" />
    <meta property="og:image" content="https://alexmorgan.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alex Morgan — Frontend Developer · React · JavaScript · AI" />
    <meta
      name="twitter:description"
      content="Fast, polished React websites, landing pages and AI-powered web features for startups and businesses."
    />
    <meta name="twitter:image" content="https://alexmorgan.dev/og-image.png" />

    <!-- Structured data (Person + WebSite). No ratings/reviews — none exist. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alex Morgan",
        "url": "https://alexmorgan.dev/",
        "jobTitle": "Frontend Developer",
        "description": "Frontend developer building modern websites and web applications with React, JavaScript and AI integrations.",
        "knowsAbout": [
          "React",
          "JavaScript",
          "Frontend development",
          "Tailwind CSS",
          "AI integrations",
          "Web performance"
        ],
        "sameAs": ["https://github.com/alexmorgan", "https://www.linkedin.com/in/alexmorgan"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Alex Morgan — Frontend Developer",
        "url": "https://alexmorgan.dev/"
      }
    </script>

    <!-- Set theme before first paint to avoid flash of wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
